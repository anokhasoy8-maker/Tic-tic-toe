<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultimate Tic-Tac-Toe</title>
  <style>
    :root {
      --bg-1: #f5f7ff;
      --bg-2: #eaf4ff;
      --card-bg: rgba(255, 255, 255, 0.82);
      --panel: rgba(148, 163, 184, 0.08);
      --text: #111827;
      --muted: #475569;
      --border: rgba(148, 163, 184, 0.38);
      --button-bg: #111827;
      --button-text: #f8fafc;
      --player-x: #2563eb;
      --player-o: #ef4444;
      --x-soft: rgba(37, 99, 235, 0.12);
      --o-soft: rgba(239, 68, 68, 0.12);
      --win-bg: rgba(34, 197, 94, 0.18);
      --win-border: #22c55e;
      --win-text: #166534;
      --shadow: rgba(15, 23, 42, 0.14);
      --ring: rgba(99, 102, 241, 0.18);
      --glow: rgba(59, 130, 246, 0.22);
    }

    body[data-theme="dark"] {
      --bg-1: #0b1020;
      --bg-2: #111827;
      --card-bg: rgba(17, 24, 39, 0.82);
      --panel: rgba(148, 163, 184, 0.08);
      --text: #e5eefb;
      --muted: #a5b4cf;
      --border: rgba(148, 163, 184, 0.22);
      --button-bg: #e2e8f0;
      --button-text: #0b1020;
      --player-x: #7cc7ff;
      --player-o: #ff7d7d;
      --x-soft: rgba(124, 199, 255, 0.12);
      --o-soft: rgba(255, 125, 125, 0.12);
      --win-bg: rgba(34, 197, 94, 0.13);
      --win-border: #34d399;
      --win-text: #bbf7d0;
      --shadow: rgba(0, 0, 0, 0.35);
      --ring: rgba(148, 163, 184, 0.12);
      --glow: rgba(99, 102, 241, 0.26);
    }

    body[data-theme="neon"] {
      --bg-1: #070b14;
      --bg-2: #101827;
      --card-bg: rgba(9, 13, 24, 0.78);
      --panel: rgba(15, 23, 42, 0.9);
      --text: #e6f7ff;
      --muted: #a9d3ff;
      --border: rgba(30, 144, 255, 0.32);
      --button-bg: #00e5ff;
      --button-text: #04141d;
      --player-x: #00e5ff;
      --player-o: #ff4fd8;
      --x-soft: rgba(0, 229, 255, 0.12);
      --o-soft: rgba(255, 79, 216, 0.12);
      --win-bg: rgba(34, 197, 94, 0.14);
      --win-border: #52f0a5;
      --win-text: #b8ffe3;
      --shadow: rgba(0, 229, 255, 0.18);
      --ring: rgba(0, 229, 255, 0.18);
      --glow: rgba(255, 79, 216, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: Inter, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow: hidden;
    }

    .ambient {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.45;
    }

    .ambient::before {
      background: rgba(59, 130, 246, 0.18);
      top: -100px;
      left: -80px;
    }

    .ambient::after {
      background: rgba(168, 85, 247, 0.18);
      right: -60px;
      bottom: -90px;
    }

    .game-card {
      position: relative;
      z-index: 1;
      width: min(430px, 92vw);
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: 0 24px 50px var(--shadow);
      padding: 22px 20px 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tag {
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.08);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--border);
    }

    h2 {
      margin: 0;
      font-size: clamp(1.9rem, 3vw, 2.4rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .theme-switch {
      display: flex;
      padding: 4px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      gap: 4px;
    }

    .theme-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      border-radius: 999px;
      padding: 7px 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 52px;
    }

    .theme-btn.active {
      background: var(--button-bg);
      color: var(--button-text);
      box-shadow: 0 8px 18px var(--glow);
    }

    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 15px;
    }

    .mode-btn {
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.14);
      color: var(--text);
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 0.01em;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, var(--button-bg), rgba(99, 102, 241, 0.82));
      color: var(--button-text);
      border-color: transparent;
      box-shadow: 0 16px 25px var(--ring);
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px;
      margin-bottom: 14px;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 6px;
      min-height: 72px;
    }

    .label {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 800;
    }

    .score-value {
      margin-top: 6px;
      font-weight: 900;
      font-size: clamp(1.25rem, 3vw, 1.6rem);
    }

    .status {
      text-align: center;
      font-weight: 800;
      font-size: 1rem;
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      color: var(--text);
    }

    .board-wrap {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 22px;
      padding: 12px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .cell {
      position: relative;
      aspect-ratio: 1;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      cursor: pointer;
      font-size: clamp(2.2rem, 9vw, 3rem);
      font-weight: 900;
      transition: all 0.18s ease;
      user-select: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .cell:hover:not(:disabled) {
      transform: translateY(-1px) scale(1.01);
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 12px 18px rgba(99, 102, 241, 0.08);
    }

    .cell:disabled {
      cursor: default;
    }

    .cell.x {
      background: var(--x-soft);
      color: var(--player-x);
    }

    .cell.o {
      background: var(--o-soft);
      color: var(--player-o);
    }

    .cell.win-cell {
      background: var(--win-bg);
      border-color: var(--win-border);
      color: var(--win-text);
      box-shadow: 0 12px 24px rgba(34, 197, 94, 0.16);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .action-btn {
      border: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.12);
    }

    .action-btn:hover {
      transform: translateY(-1px);
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--button-bg), rgba(99, 102, 241, 0.9));
      color: var(--button-text);
    }

    .action-btn.secondary {
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid var(--border);
      color: var(--text);
    }

    @media (max-width: 420px) {
      body {
        padding: 18px;
      }

      .game-card {
        padding: 18px 14px 16px;
        border-radius: 24px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .theme-switch {
        width: 100%;
      }

      .theme-btn {
        flex: 1;
      }
    }
  </style>
</head>
<body data-theme="light">
  <div class="ambient"></div>

  <div class="game-card">
    <div class="topbar">
      <div class="title-wrap">
        <span class="tag">Classic Game</span>
        <h2>Tic-Tac-Toe</h2>
      </div>

      <div class="theme-switch">
        <button class="theme-btn active" data-theme="light" aria-label="Light theme">Light</button>
        <button class="theme-btn" data-theme="dark" aria-label="Dark theme">Dark</button>
        <button class="theme-btn" data-theme="neon" aria-label="Neon theme">Neon</button>
      </div>
    </div>

    <div class="mode-toggle">
      <button id="pvpBtn" class="mode-btn active">2 Players</button>
      <button id="aiBtn" class="mode-btn">vs Computer</button>
    </div>

    <div class="scoreboard">
      <div class="score-box">
        <span class="label">X</span>
        <span id="scoreX" class="score-value">0</span>
      </div>
      <div class="score-box">
        <span class="label">Ties</span>
        <span id="scoreTies" class="score-value">0</span>
      </div>
      <div class="score-box">
        <span class="label" id="labelO">O</span>
        <span id="scoreO" class="score-value">0</span>
      </div>
    </div>

    <div id="status" class="status">Turn: Player X</div>

    <div class="board-wrap">
      <div id="board" class="board" aria-label="Tic-Tac-Toe board">
        <button class="cell" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" aria-label="Cell 3"></button>
        <button class="cell" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" aria-label="Cell 6"></button>
        <button class="cell" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" aria-label="Cell 9"></button>
      </div>
    </div>

    <div class="controls">
      <button id="restartBtn" class="action-btn primary">Restart</button>
      <button id="undoBtn" class="action-btn secondary">Undo</button>
    </div>
  </div>

  <script>
    const winningConditions = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    let currentPlayer = 'X';
    let boardState = Array(9).fill('');
    let gameActive = true;
    let isAiMode = false;
    let isAiThinking = false;
    let soundEnabled = true;
    let moveHistory = [];
    let scores = { x: 0, o: 0, ties: 0 };

    const statusText = document.getElementById('status');
    const cells = document.querySelectorAll('.cell');
    const restartBtn = document.getElementById('restartBtn');
    const undoBtn = document.getElementById('undoBtn');
    const pvpBtn = document.getElementById('pvpBtn');
    const aiBtn = document.getElementById('aiBtn');
    const labelO = document.getElementById('labelO');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');
    const scoreTiesEl = document.getElementById('scoreTies');
    const themeButtons = document.querySelectorAll('.theme-btn');

    function updateScoreboardLabels() {
      labelO.textContent = isAiMode ? 'CPU' : 'O';
    }

    function getAudioContext() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!window.__tttAudioCtx) {
        window.__tttAudioCtx = new AudioCtx();
      }
      return window.__tttAudioCtx;
    }

    function playTone(freq, type, duration = 0.12) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    }

    function renderScores() {
      scoreXEl.textContent = scores.x;
      scoreOEl.textContent = scores.o;
      scoreTiesEl.textContent = scores.ties;
    }

    function resetBoard() {
      currentPlayer = 'X';
      boardState = Array(9).fill('');
      gameActive = true;
      isAiThinking = false;
      moveHistory = [];

      cells.forEach(cell => {
        cell.textContent = '';
        cell.disabled = false;
        cell.classList.remove('win-cell', 'x', 'o');
      });

      statusText.textContent = 'Turn: Player X';
      renderScores();
    }

    function checkWinnerForBoard(board) {
      for (let i = 0; i < winningConditions.length; i++) {
        const [a, b, c] = winningConditions[i];
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return board[a];
        }
      }
      return null;
    }

    function evaluateBoard(board) {
      const winner = checkWinnerForBoard(board);
      if (winner === 'O') return 10;
      if (winner === 'X') return -10;
      return 0;
    }

    function minimax(board, depth, isMaximizing) {
      const score = evaluateBoard(board);
      if (score === 10) return score - depth;
      if (score === -10) return score + depth;
      if (!board.includes('')) return 0;

      if (isMaximizing) {
        let bestScore = -Infinity;
        for (let i = 0; i < board.length; i++) {
          if (board[i] === '') {
            board[i] = 'O';
            const currentScore = minimax(board, depth + 1, false);
            board[i] = '';
            bestScore = Math.max(bestScore, currentScore);
          }
        }
        return bestScore;
      }

      let bestScore = Infinity;
      for (let i = 0; i < board.length; i++) {
        if (board[i] === '') {
          board[i] = 'X';
          const currentScore = minimax(board, depth + 1, true);
          board[i] = '';
          bestScore = Math.min(bestScore, currentScore);
        }
      }
      return bestScore;
    }

    function findBestMove() {
      let bestScore = -Infinity;
      let bestMove = -1;

      for (let i = 0; i < boardState.length; i++) {
        if (boardState[i] === '') {
          boardState[i] = 'O';
          const score = minimax(boardState, 0, false);
          boardState[i] = '';
          if (score > bestScore) {
            bestScore = score;
            bestMove = i;
          }
        }
      }

      if (bestMove === -1) {
        const emptyIndices = boardState
          .map((v, idx) => (v === '' ? idx : null))
          .filter(v => v !== null);
        return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      }

      return bestMove;
    }

    function findWinningCombo() {
      for (let i = 0; i < winningConditions.length; i++) {
        const [a, b, c] = winningConditions[i];
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
          return [a, b, c];
        }
      }
      return [];
    }

    function finishRound(winner) {
      gameActive = false;

      if (winner === 'X') {
        scores.x += 1;
        statusText.textContent = 'Player X Wins! 🎉';
      } else if (winner === 'O') {
        scores.o += 1;
        statusText.textContent = isAiMode ? 'Computer Wins! 🎉' : 'Player O Wins! 🎉';
      }

      findWinningCombo().forEach(index => cells[index].classList.add('win-cell'));
      renderScores();
    }

    function handleBoardComplete() {
      const winner = checkWinnerForBoard(boardState);

      if (winner) {
        finishRound(winner);
        return true;
      }

      if (!boardState.includes('')) {
        gameActive = false;
        scores.ties += 1;
        statusText.textContent = 'Game ended in a Draw! 🤝';
        renderScores();
        return true;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      statusText.textContent = isAiMode && currentPlayer === 'O'
        ? 'Turn: Computer'
        : `Turn: Player ${currentPlayer}`;
      return false;
    }

    function makeMove(index, player) {
      if (boardState[index] !== '' || !gameActive) return false;

      boardState[index] = player;
      moveHistory.push({ index, player });

      const cell = cells[index];
      cell.textContent = player;
      cell.classList.remove('x', 'o');
      cell.classList.add(player === 'X' ? 'x' : 'o');
      cell.disabled = true;
      playTone(player === 'X' ? 440 : 220, 'sine', 0.12);
      return true;
    }

    function computerMove() {
      if (!gameActive || !isAiMode) return;

      isAiThinking = true;
      statusText.textContent = 'Computer is thinking...';

      setTimeout(() => {
        if (!gameActive || !isAiMode) {
          isAiThinking = false;
          return;
        }

        const moveIndex = findBestMove();
        if (moveIndex !== undefined && moveIndex !== null) {
          makeMove(moveIndex, 'O');
          const gameOver = handleBoardComplete();
          if (!gameOver && currentPlayer === 'X') {
            statusText.textContent = 'Turn: Player X';
          }
        }

        isAiThinking = false;
      }, 420);
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const index = Number(cell.dataset.index);
        if (!gameActive || boardState[index] !== '' || isAiThinking) return;

        if (makeMove(index, currentPlayer)) {
          const gameOver = handleBoardComplete();
          if (!gameOver && isAiMode && currentPlayer === 'O') {
            computerMove();
          }
        }
      });
    });

    restartBtn.addEventListener('click', resetBoard);

    undoBtn.addEventListener('click', () => {
      if (moveHistory.length === 0 || isAiThinking) return;

      const stepsToUndo = (
        isAiMode &&
        moveHistory.length >= 2 &&
        moveHistory[moveHistory.length - 1].player === 'O'
      ) ? 2 : 1;

      for (let step = 0; step < stepsToUndo; step++) {
        if (moveHistory.length === 0) break;
        const lastMove = moveHistory.pop();
        boardState[lastMove.index] = '';

        const cell = cells[lastMove.index];
        cell.textContent = '';
        cell.classList.remove('x', 'o', 'win-cell');
        cell.disabled = false;
      }

      gameActive = true;
      currentPlayer = (moveHistory.length % 2 === 0) ? 'X' : 'O';
      statusText.textContent = isAiMode && currentPlayer === 'O'
        ? 'Turn: Computer'
        : `Turn: Player ${currentPlayer}`;
    });

    pvpBtn.addEventListener('click', () => {
      isAiMode = false;
      pvpBtn.classList.add('active');
      aiBtn.classList.remove('active');
      updateScoreboardLabels();
      resetBoard();
    });

    aiBtn.addEventListener('click', () => {
      isAiMode = true;
      aiBtn.classList.add('active');
      pvpBtn.classList.remove('active');
      updateScoreboardLabels();
      resetBoard();
    });

    themeButtons.forEach(button => {
      button.addEventListener('click', () => {
        const selectedTheme = button.dataset.theme;
        document.body.setAttribute('data-theme', selectedTheme);
        themeButtons.forEach(btn => btn.classList.toggle('active', btn === button));
      });
    });

    updateScoreboardLabels();
    renderScores();
  </script>
</body>
</html>
